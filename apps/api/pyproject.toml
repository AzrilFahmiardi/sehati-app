[project]
name = "hemavision-api"
version = "0.1.0"
description = "Core API for the Hemavision non invasive anemia screening system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "sqlalchemy>=2.0.37",
    "alembic>=1.14.1",
    "psycopg[binary]>=3.2.4",
    "httpx>=0.28.1",
    "google-auth>=2.37.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-kms>=3.2.0",
    "google-cloud-secret-manager>=2.21.1",
    "google-cloud-tasks>=2.18.0",
    "firebase-admin>=6.6.0",
    "structlog>=25.1.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.9.1",
    "mypy>=1.14.1",
    "ruff>=0.9.2",
    "import-linter>=2.1",
    "schemathesis>=3.39.0",
    "pip-audit>=2.7.3",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hemavision_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/hemavision_api/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=hemavision_api --cov-report=term-missing"

[tool.importlinter]
root_package = "hemavision_api"

[[tool.importlinter.contracts]]
name = "Modul tidak boleh saling mengimpor kode Python secara langsung"
type = "forbidden"
source_modules = "hemavision_api.modules"
forbidden_modules = "hemavision_api.modules"
